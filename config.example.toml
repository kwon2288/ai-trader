# 이 파일은 예시입니다. 처음 실행하면 config.toml 로 복사되고, 실제 설정은 config.toml(또는 웹 설정)에서 바꿉니다.
# ─────────────────────────────────────────────────────────────
#  AI 자동매매 설정 — 숫자만 바꿔서 쓰면 됩니다.
#  자격증명(앱키·API키)은 이 파일이 아니라 .env 에 넣으세요.
# ─────────────────────────────────────────────────────────────

[budget]
# 봇이 굴릴 총 원금. 계좌에 돈이 더 있어도 이 금액까지만 씁니다.
total_krw = 100_000
# 한 종목에 넣을 수 있는 최대 금액
max_per_position_krw = 50_000
# 동시에 보유할 최대 종목 수
max_positions = 2

[risk]
# 손절/익절은 AI 판단과 상관없이 코드가 먼저 실행합니다 (%)
stop_loss_pct = -7.0
take_profit_pct = 15.0
# 봇 자산(현금+보유평가)이 원금 대비 이 비율 아래로 떨어지면 매매 중지 (%)
max_drawdown_pct = -20.0
# 하루 최대 주문 횟수 (매수+매도)
max_orders_per_day = 4
# AI 확신도가 이 값 미만이면 무시 (0~1)
min_confidence = 0.6
# 매수 후 최소 보유일 — 잦은 단타로 수수료 새는 것 방지 (손절/익절은 예외)
min_hold_days = 2

[order]
# "market" = 시장가(즉시 체결), "limit" = 최우선 호가 지정가
type = "market"

[ai]
# 판단에 쓸 AI: "claude" | "gemini" | "openai"(ChatGPT) | "consensus"(키가 있는 AI 전부에게 묻고 다수결)
#              | "rules"(AI 없이 규칙만 — 무료)
provider = "claude"
# 하이브리드: 규칙(추세·과열)이 먼저 신호를 찾고, 신호 난 종목만 AI 에게 확인 → 신호 없으면 AI 호출 생략
hybrid = true
news = false        # AI 에 최근 뉴스 제목·공시(DART)도 함께 보내기 — 웹 설정 → AI 에서 켜고 끔
claude_model = "claude-sonnet-5-5"   # 저렴: claude-haiku-5-5
gemini_model = "gemini-3.8-flash"    # 저렴: gemini-3.5-flash-lite
openai_model = "gpt-6.1-sol"         # 저렴: gpt-6-luna
max_tokens = 4000

# 분석 대상 = 핵심 종목(symbols, 항상 분석) + 자동 선정 종목(매일 갱신)
# 현재가가 max_per_position_krw 보다 비싼 종목은 매수 후보에서 빠집니다.
[universe]
# 자동 선정: 그날 첫 실행 때 전 종목에서 조건 검색 → 전일 거래대금 상위 N개 (NH 전용)
auto_count = 10            # 자동 선정 종목 수 (0 = 끄기)
auto_min_price = 1000      # 최소 주가 (원)
auto_min_cap_eok = 3000    # 최소 시가총액 (억원)
auto_include_etf = false   # ETF 포함 여부 (레버리지·인버스·채권형은 항상 제외)
auto_scan_pool = 200       # 시총 상위 몇 개를 시세 조회할지 (클수록 오래 걸림, 초당 4건)
# 핵심 종목 (6자리 코드)
symbols = [
  "069500",  # KODEX 200
  "229200",  # KODEX 코스닥150
  "360750",  # TIGER 미국S&P500
  "133690",  # TIGER 미국나스닥100
  "035720",  # 카카오
  "015760",  # 한국전력
  "316140",  # 우리금융지주
  "024110",  # 기업은행
  "003490",  # 대한항공
  "010140",  # 삼성중공업
  "032640",  # LG유플러스
  "028670",  # 팬오션
  "088350",  # 한화생명
  "034020",  # 두산에너빌리티
  "042660",  # 한화오션
]

# ─────────────────────────────────────────────────────────────
#  미국 주식 — 국내와 예산·장부·손실한도가 따로 (손절·익절·확신도 등 비율은 공유)
#  실행: python run.py trade --market us   (미국 정규장 = 한국시간 23:30~06:00, 서머타임 22:30~05:00)
# ─────────────────────────────────────────────────────────────
[us]
enabled = false
total_usd = 300               # 봇이 굴릴 미국 원금 (달러)
max_per_position_usd = 150    # 한 종목 최대 (달러) — 이보다 비싼 종목은 매수 후보에서 제외
max_positions = 2
max_orders_per_day = 4
order_type = "limit"          # 미국은 지정가 권장 (호가 기준)
margin_currency = "krw"       # NH: krw = 원화로 바로 주문(환전 불필요), usd = 달러 예수금 사용
symbols = [
  "SPLG",   # SPDR S&P500 (저가형)
  "SCHD",   # 미국 배당
  "SCHG",   # 미국 성장
  "JEPI",   # 커버드콜 인컴
  "KO",     # 코카콜라
  "PFE",    # 화이자
  "INTC",   # 인텔
  "F",      # 포드
  "T",      # AT&T
  "BAC",    # 뱅크오브아메리카
  "CSCO",   # 시스코
  "VZ",     # 버라이즌
  "WFC",    # 웰스파고
  "PLTR",   # 팔란티어
  "SOFI",   # 소파이
]

[notify]
# 알림 (텔레그램·카카오톡 연결은 웹 설정 → 알림). 켜고 끌 종류:
orders = true      # 주문 실행·실패
errors = true      # 실행 오류 (AI·증권사 연결 등)
halt = true        # 최대 손실 한도로 정지
daily = false      # 하루 마감 요약 (그날 마지막 실행 후)

[schedule]
# 자동 실행 시각 (평일). 웹 설정 → 자동 실행 시각에서 바꾸면 타이머에 바로 적용돼요.
kr = ["10:00", "14:30"]   # 한국시간 (09:10~15:10)
us = ["10:30", "15:00"]   # 뉴욕시간 (09:40~15:50, 서머타임 자동)
watch_minutes = 15        # 장중 손절 감시 간격 (분, 0 = 끄기) — AI 없이 손절·익절만

[costs]
# 손익 계산용 수수료·세금 (%). 증권사가 실제 값을 알려 주면(토스) 그 값을 씁니다.
kr_fee_pct = 0.015        # 국내 수수료 (매수·매도 각각)
kr_sell_tax_pct = 0.20    # 국내 매도 거래세 (2026년 코스피·코스닥 0.20%, ETF·ETN 은 면제)
us_fee_pct = 0.25         # 미국 수수료 (매수·매도 각각)

[backup]
# 매매 기록·설정 백업 (하루 한 번 자동, 웹 설정 → 백업에서 바로 실행·내려받기)
keep_days = 14        # 보관 기간 (일)
extra_dir = ""        # 추가 저장 위치 (예: "/mnt/nas/ai-trader-backup") — 비우면 data/backups 에만
include_env = false   # .env(앱키·비밀번호)도 포함할지
remote_type = ""      # 원격 저장: "" | "ftp" | "ftps" | "webdav"  (비밀번호는 .env 의 BACKUP_REMOTE_PASSWORD)
remote_url = ""       # 예: "ftp://nas.local/backup/ai-trader" · "https://nas.local:5006/backup/ai-trader"
remote_user = ""
